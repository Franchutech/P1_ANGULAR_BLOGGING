<div class="container mt-4">
    <h2 class="text-center mb-4">Sistema Blogging en Angular</h2>
    <div class="row">
            <!--ÁREA PARA MI FORMULARIO-->
        <div class="col-md-5">
            <div class="card p-3 shadow-sm">
                <h4>Futuro Formulario</h4>
                <p class="text-muted">Espacio Reservado para Formulario</p>
            </div>
        </div>

            <!--ÁREA PARA MI FORMULARIO-->

        <div class="col-md-7">
            <div class="card p-3 shadow-sm">
                <h4>Listado de Noticias</h4>
                <!--Uso el ngFor para recorrer mi array de publicaciones-->
                @for (publicacion of listaPublicaciones; track publicacion.Titulo) {
                    <div class="card mb-3">
                        <img [src]="publicacion.Imagen" class="card-img-top" alt="Imagen">
                        <div class="card-body">
                            <h5 class="card-title">{{ publicacion.Titulo}}</h5>
                            <p class="card-text">{{ publicacion.Texto}}</p>
                            <p class="text-muted"><small>{{publicacion.FechaPublicacion}}</small></p>
                        </div>
                    </div>            
                }
            </div>    
        </div>
    </div>    
</div>
