<div class="container mt-4">
    <h2 class="text-center mb-4">Sistema Blogging en Angular</h2>
    <div class="row">
            <!--ÁREA PARA FORMULARIO-->
        <div class="col-md-5">
            <div class="card p-3 shadow-sm">
                <h4>Nueva Publicación</h4>
                
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" [(ngModel)]="nuevaNoticia.Titulo">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ruta Imagen (ej: imagen3.jpg)</label>
                    <input type="text" class="form-control" [(ngModel)]="nuevaNoticia.Imagen">
                </div>

                <div class="mb-3">
                    <label class="form-label">Texto</label>
                    <textarea class="form-control" [(ngModel)]="nuevaNoticia.Texto"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" [(ngModel)]="nuevaNoticia.FechaPublicacion">
                </div>

                <button class="btn btn-success w-100" (click)="agregarNoticia()">Guardar Noticia</button>
            </div>
        </div>

            <!--ÁREA PARA MIS NOTICIAS-->
        <div class="col-md-7">
            <div class="card p-3 shadow-sm">
                <h4>Listado de Noticias</h4>
                @for (publicacion of listaPublicaciones; track publicacion.Titulo) {
                    <div class="card mb-3">
                        <img [src]="publicacion.Imagen" class="card-img-top" alt="Imagen">
                        <div class="card-body">
                            <h5 class="card-title">{{ publicacion.Titulo}}</h5>
                            <p class="card-text">{{ publicacion.Texto}}</p>
                            <p class="text-muted"><small>{{publicacion.FechaPublicacion}}</small></p>
                        </div>
                    </div>            
                }
            </div>    
        </div>
    </div>    
</div>
